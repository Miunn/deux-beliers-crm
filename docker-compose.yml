services:
  app:
    build: .
    restart: always
    ports:
      - 3000:3000
    env_file:
      - .env
    environment:
      # Inside Docker, 127.0.0.1 is the app container itself — use the db service name.
      DATABASE_URL: mysql://root:root44115%21@db:3306/db2BCRM?allowPublicKeyRetrieval=true
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql
    restart: always
    environment:
      MYSQL_USER: db2Buser
      MYSQL_DATABASE: db2BCRM
      MYSQL_PASSWORD: root44115!
      MYSQL_ROOT_PASSWORD: root44115!
    ports:
      - 3306:3306
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot44115!"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  db_data:
    driver: local
